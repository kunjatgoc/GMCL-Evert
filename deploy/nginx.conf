# Global Market League -- the VPS server block.
#
# Replaces what vercel.json used to say. Two routes and nothing else: /api/*
# goes to the uvicorn process, and every other path serves the built page so
# the client-side router can read the pathname.
#
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/gmcl
#     sudo ln -s /etc/nginx/sites-available/gmcl /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# TLS is left to certbot, which rewrites the listen lines and adds the
# redirect: `sudo certbot --nginx -d playgml.com -d www.playgml.com`.

upstream gmcl_api {
    # uvicorn, bound to loopback so the API is reachable only through nginx:
    #     .venv/bin/uvicorn --env-file .env api.index:app \
    #         --host 127.0.0.1 --port 8000 --workers 4
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name playgml.com www.playgml.com;

    # The built page. `npm run build` writes it, and nothing here is generated
    # at request time. This is the checkout itself rather than a copy of it --
    # one path to keep right, and a deploy that rebuilds in place is already
    # serving the new files.
    root /opt/GMCL-Evert/dist;
    index index.html;

    # A registration is a few hundred bytes; anything larger is not a form.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API. proxy_pass with no URI part keeps the original path, so FastAPI
    # sees /api/register rather than /register and the routes in api/index.py
    # need no prefix stripping.
    location /api/ {
        proxy_pass http://gmcl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app cannot tell an https request from an http one,
        # and a Secure cookie set behind a terminating proxy looks wrong.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing here is slower than a password hash and one query, but the
        # GOC check-user call waits on another company's API --
        # GML_CHECK_TIMEOUT is 8s, so 30 leaves room for it plus the round
        # trip either side.
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
        proxy_send_timeout   30s;
    }

    # Vite writes a content hash into every asset filename, so a changed file
    # is a changed URL and these can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single page. try_files rather than the list of
    # paths vercel.json enumerated: a route added to src/main.tsx is served
    # here without an edit, which is what the enumerated list kept getting
    # wrong -- /league was in the app and never in vercel.json, so a refresh
    # on it answered 404.
    location / {
        # index.html carries no hash of its own and names the hashed bundles,
        # so a cached copy points at assets a deploy has already replaced.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
